services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agencyadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - media_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    user: "0:0"
    entrypoint: ["/usr/bin/mc"]
    command: ["alias", "set", "local", "http://minio:9000", "${MINIO_ROOT_USER:-agencyadmin}", "${MINIO_ROOT_PASSWORD:-change-this-minio-password}"]
    environment:
      MC_CONFIG_DIR: /mc-config
    volumes:
      - minio_mc_config:/mc-config

  minio-init-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/agency-media"]
    environment:
      MC_CONFIG_DIR: /mc-config
    volumes:
      - minio_mc_config:/mc-config

  minio-init-public:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio-init-bucket:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: ["/usr/bin/mc"]
    command: ["anonymous", "set", "download", "local/agency-media"]
    environment:
      MC_CONFIG_DIR: /mc-config
    volumes:
      - minio_mc_config:/mc-config

  cms:
    build:
      context: ./cms
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio-init-public:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3055
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-replace-this-with-a-long-random-secret}
      PAYLOAD_PUBLIC_SERVER_URL: ${NUXT_PUBLIC_PAYLOAD_URL:-http://localhost:3055}
      DATABASE_URI: mongodb://mongo:27017/digitalspot
      PAYLOAD_ADMIN_EMAIL: ${PAYLOAD_ADMIN_EMAIL:-admin@stigma.studio}
      PAYLOAD_ADMIN_PASSWORD: ${PAYLOAD_ADMIN_PASSWORD:-change-this-password}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agencyadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      S3_BUCKET: agency-media
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/agency-media}
    ports:
      - "3055:3055"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3055/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  crm:
    build:
      context: ./crm
      args:
        TINY_CRM_REF: 4d78908065cead042427322e53449c56f4bbc0b3
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${CRM_APP_URL:-http://localhost:8000}
      APP_KEY: ${CRM_APP_KEY:-}
      APP_NAME: TinyCRM
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/tiny-crm/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      WEBSITE_CRM_API_TOKEN: ${CRM_API_TOKEN:-change-this-crm-api-token}
      CRM_ADMIN_NAME: ${CRM_ADMIN_NAME:-Digital Spot}
      CRM_ADMIN_EMAIL: ${CRM_ADMIN_EMAIL:-admin@digitalspot.local}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:-change-this-crm-password}
    volumes:
      - crm_data:/var/lib/tiny-crm
    ports:
      - "127.0.0.1:${CRM_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/app/login') === false ? 1 : 0);"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
      crm:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_PAYLOAD_URL: ${NUXT_PUBLIC_PAYLOAD_URL:-http://localhost:3055}
      NUXT_PAYLOAD_URL: http://cms:3055
      CRM_INTERNAL_URL: http://crm
      CRM_API_TOKEN: ${CRM_API_TOKEN:-change-this-crm-api-token}
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  media_data:
  crm_data:
  minio_mc_config:
